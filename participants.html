<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Participants</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>College Event Management System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="host.html">Manage Events</a>
        <a href="participants.html">Participants</a>
    </nav>

</header>


<section class="registration">

    <h2>Registered Participants</h2>

    <div id="participantsContainer">
        Loading participants...
    </div>

</section>


<footer>
    <p>© 2026 College Event Management System</p>
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBCd9jgelyscNH8uht8s8nFsRfXkvK-eIbg",

    authDomain:
        "college-event-managment-b5d1b.firebaseapp.com",

    projectId:
        "college-event-managment-b5d1b",

    storageBucket:
        "college-event-managment-b5d1b.firebasestorage.app",

    messagingSenderId:
        "627227280897",

    appId:
        "1:627227280897:web:83f5c219c297188676e200"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const container =
    document.getElementById(
        "participantsContainer"
    );


// LOAD PARTICIPANTS

async function loadParticipants() {

    try {

        const snapshot =
            await getDocs(
                collection(db, "registrations")
            );

        container.innerHTML = "";


        if (snapshot.empty) {

            container.innerHTML =
                "<p>No participants registered yet.</p>";

            return;

        }


        snapshot.forEach(
            (participantDoc) => {

                const participant =
                    participantDoc.data();


                const card =
                    document.createElement("div");


                card.style.border =
                    "1px solid #ccc";

                card.style.padding =
                    "15px";

                card.style.margin =
                    "15px 0";

                card.style.borderRadius =
                    "10px";


                card.innerHTML = `

                    <h3>
                        ${participant.name}
                    </h3>

                    <p>
                        <b>Roll Number:</b>
                        ${participant.rollNumber || "N/A"}
                    </p>

                    <p>
                        <b>Email:</b>
                        ${participant.email || "N/A"}
                    </p>

                    <p>
                        <b>Phone:</b>
                        ${participant.phone || "N/A"}
                    </p>

                    <p>
                        <b>Department:</b>
                        ${participant.department || "N/A"}
                    </p>

                    <p>
                        <b>Event:</b>
                        ${participant.event || "N/A"}
                    </p>

                    <button class="deleteButton">
                        Delete Participant
                    </button>

                `;


                const deleteButton =
                    card.querySelector(
                        ".deleteButton"
                    );


                // DELETE PARTICIPANT

                deleteButton.addEventListener(
                    "click",
                    async function() {

                        const confirmDelete =
                            confirm(
                                "Delete this participant?"
                            );


                        if (!confirmDelete) {
                            return;
                        }


                        try {

                            await deleteDoc(
                                doc(
                                    db,
                                    "registrations",
                                    participantDoc.id
                                )
                            );


                            alert(
                                "Participant deleted successfully! ✅"
                            );


                            // REMOVE FROM SCREEN

                            card.remove();


                        } catch (error) {

                            console.error(error);

                            alert(
                                "Unable to delete participant ❌"
                            );

                        }

                    }
                );


                container.appendChild(card);

            }
        );


    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Unable to load participants ❌</p>";

    }

}


loadParticipants();

</script>

</body>

</html>
