<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Payment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>College Event Management System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
        <a href="host-login.html">Host Login</a>
    </nav>
</header>


<section class="registration">

    <h2>Event Payment</h2>

    <h3>Registration Fee: ₹100</h3>

    <p id="eventName"></p>

    <div class="payment-section">

        <h3>Pay using PhonePe</h3>

        <p>Scan the QR code below and pay ₹100</p>

        <img
            src="phonepe.png"
            alt="PhonePe QR Code"
            class="payment-qr"
        >

        <p>
            <b>
                After payment, enter your transaction ID.
            </b>
        </p>

    </div>


    <label>PhonePe Transaction ID</label>

    <input
        type="text"
        id="transactionId"
        placeholder="Enter transaction ID"
    >

    <br><br>

    <button id="paymentButton">
        Submit Payment
    </button>

    <p id="paymentMessage"></p>

</section>


<footer>
    <p>© 2026 College Event Management System</p>
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyBCd9jgelyscNH8uht8s8nFsRfXkvK-eIbg",

    authDomain:
        "college-event-managment-b5d1b.firebaseapp.com",

    projectId:
        "college-event-managment-b5d1b",

    storageBucket:
        "college-event-managment-b5d1b.firebasestorage.app",

    messagingSenderId:
        "627227280897",

    appId:
        "1:627227280897:web:83f5c219c297188676e200"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


// GET STUDENT DETAILS

const studentName =
    sessionStorage.getItem("studentName") || "";

const rollNumber =
    sessionStorage.getItem("rollNumber") || "";

const email =
    sessionStorage.getItem("email") || "";

const phone =
    sessionStorage.getItem("phone") || "";

const department =
    sessionStorage.getItem("department") || "";

const selectedEvent =
    sessionStorage.getItem("selectedEvent") || "";


document.getElementById("eventName").innerHTML =
    "Selected Event: <b>" +
    selectedEvent +
    "</b>";


// PAYMENT BUTTON

document.getElementById("paymentButton")
.addEventListener("click", async function() {


    const transactionId =
        document.getElementById("transactionId")
        .value
        .trim();


    if (transactionId === "") {

        document.getElementById(
            "paymentMessage"
        ).innerHTML =
            "Please enter transaction ID ❌";

        document.getElementById(
            "paymentMessage"
        ).style.color = "red";

        return;
    }


    try {


        // SAVE PAYMENT TO FIRESTORE

        const paymentRef =
            await addDoc(
                collection(db, "payments"),
                {

                    studentName:
                        studentName,

                    rollNumber:
                        rollNumber,

                    email:
                        email,

                    phone:
                        phone,

                    department:
                        department,

                    event:
                        selectedEvent,

                    amount:
                        100,

                    transactionId:
                        transactionId,

                    paymentStatus:
                        "Pending",

                    createdAt:
                        new Date().toISOString()

                }
            );


        console.log(
            "Payment saved:",
            paymentRef.id
        );


        // SAVE TRANSACTION ID

        sessionStorage.setItem(
            "transactionId",
            transactionId
        );


        // SHOW SUCCESS MESSAGE

        document.getElementById(
            "paymentMessage"
        ).innerHTML =
            "Payment submitted successfully! ✅";

        document.getElementById(
            "paymentMessage"
        ).style.color = "green";


        // DISABLE BUTTON

        document.getElementById(
            "paymentButton"
        ).disabled = true;


        // GO TO SUCCESS PAGE

        setTimeout(function() {

            window.location.href =
                "success.html";

        }, 1000);


    } catch (error) {

        console.error(
            "Payment Error:",
            error
        );


        document.getElementById(
            "paymentMessage"
        ).innerHTML =
            "Payment submission failed ❌";


        document.getElementById(
            "paymentMessage"
        ).style.color = "red";

    }

});

</script>

</body>

</html>
