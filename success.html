<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>College Event Management System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
        <a href="host-login.html">Host Login</a>
    </nav>

</header>


<section class="registration">

    <h2>🎉 Registration Successful!</h2>

    <p>Your event registration has been submitted.</p>

    <p>
        <b>Student Name:</b>
        <span id="studentName"></span>
    </p>

    <p>
        <b>Roll Number:</b>
        <span id="rollNumber"></span>
    </p>

    <p>
        <b>Event:</b>
        <span id="eventName"></span>
    </p>

    <p>
        <b>Transaction ID:</b>
        <span id="transactionId"></span>
    </p>

    <p>
        <b>Payment Status:</b>
        <span id="paymentStatus">
            Checking...
        </span>
    </p>

    <br>

    <a href="index.html">
        <button>Back to Home</button>
    </a>

</section>


<footer>

    <p>
        © 2026 College Event Management System
    </p>

</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    query,
    where,
    onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBCd9jgelyscNH8uht8s8nFsRfXkvK-eIbg",

    authDomain:
        "college-event-managment-b5d1b.firebaseapp.com",

    projectId:
        "college-event-managment-b5d1b",

    storageBucket:
        "college-event-managment-b5d1b.firebasestorage.app",

    messagingSenderId:
        "627227280897",

    appId:
        "1:627227280897:web:83f5c219c297188676e200"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


// GET STUDENT DETAILS

const studentName =
    sessionStorage.getItem("studentName") || "";

const rollNumber =
    sessionStorage.getItem("rollNumber") || "";

const selectedEvent =
    sessionStorage.getItem("selectedEvent") || "";

const transactionId =
    sessionStorage.getItem("transactionId") || "";


// DISPLAY DETAILS

document.getElementById("studentName").innerText =
    studentName;

document.getElementById("rollNumber").innerText =
    rollNumber;

document.getElementById("eventName").innerText =
    selectedEvent;

document.getElementById("transactionId").innerText =
    transactionId;


// FIND PAYMENT

const paymentsRef =
    collection(db, "payments");


const paymentQuery =
    query(
        paymentsRef,
        where("transactionId", "==", transactionId)
    );


// WATCH PAYMENT STATUS

onSnapshot(
    paymentQuery,
    function(snapshot) {

        const statusElement =
            document.getElementById("paymentStatus");


        if (snapshot.empty) {

            statusElement.innerText =
                "Payment Not Found ❌";

            statusElement.style.color =
                "red";

            return;
        }


        snapshot.forEach(function(paymentDoc) {

            const payment =
                paymentDoc.data();


            if (
                payment.paymentStatus ===
                "Verified"
            ) {

                statusElement.innerText =
                    "Payment Verified ✅";

                statusElement.style.color =
                    "green";

            } else {

                statusElement.innerText =
                    "Payment Pending ⏳";

                statusElement.style.color =
                    "orange";

            }

        });

    }
);


</script>

</body>

</html>
